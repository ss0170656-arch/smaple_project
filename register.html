<body class="background">

    <div class="rgf">
        <form action="homepage.html" method="post">
            <h2>Register Form</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <label for="username">Username:</label>
            <input type="text" id="username" username="username" placeholder="Enter your username" required>
            <label for="email">Email:</label>
            <input type="email" id="email" email="email" placeholder="Enter your email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" password="password" placeholder="Enter password" required>
            <button class="rgs">Register</button>

        </form>
         <p class="acc">Already have an account?
        <a href="login.html">Login</a>
    </p>

    </div>
